name: Build APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Download Gradle Wrapper
      run: |
        # Create gradle wrapper files
        mkdir -p gradle/wrapper
        
        # Download gradle-wrapper.jar
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/platforms/documentation/docs/src/snippets/wrapper/gradle-wrapper-for-github-actions/gradle/wrapper/gradle-wrapper.jar" || \
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          "https://github.com/gradle/gradle/raw/v8.2.0/platforms/documentation/docs/src/snippets/wrapper/gradle-wrapper-for-github-actions/gradle/wrapper/gradle-wrapper.jar"
        
        # Create gradle-wrapper.properties
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # Create gradlew
        curl -L -o gradlew \
          "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew"
        chmod +x gradlew
        
        # Create gradlew.bat
        curl -L -o gradlew.bat \
          "https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew.bat"
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
    
    - name: Build Debug APK
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        ./gradlew assembleDebug --info --stacktrace
      env:
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
    
    - name: Check APK exists
      run: |
        echo "Checking for APK files..."
        find . -name "*.apk" -type f 2>/dev/null | head -20
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "APK directory not found"
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: debug-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        if-no-files-found: warn
    
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/*.apk
        name: 优品快回复 ${{ github.ref_name }}
        body: |
          ## 🎉 优品快回复 ${{ github.ref_name }} 正式发布

          ### ✨ 功能特性
          - 💬 悬浮窗快捷回复
          - 🏷️ 三级话术分类（公司/小组/私人）
          - 🔍 智能搜索
          - 📋 一键复制
          - 📊 使用统计
          - 🎨 微信风格 UI

          ### 📱 系统要求
          - Android 5.0+ (API 21+)

          ### 🚀 安装方式
          1. 下载 APK 文件
          2. 允许安装未知来源应用
          3. 安装并开启悬浮窗权限
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
