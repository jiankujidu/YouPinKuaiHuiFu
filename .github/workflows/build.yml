name: Build APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create gradle wrapper
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # Download gradle wrapper jar
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.2.0/subprojects/wrapper/src/main/resources/gradle-wrapper.jar
        
        # Create gradlew script
        cat > gradlew << 'EOF'
        #!/bin/bash
        APP_HOME=$(cd "$(dirname "$0")" && pwd)
        CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
        exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
        chmod +x gradlew
    
    - name: Build Debug APK
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        ./gradlew assembleDebug --stacktrace --info || true
        
        # Check if APK was created
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "APK built successfully!"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
        else
          echo "APK not found, checking build directory..."
          find app/build -name "*.apk" 2>/dev/null || echo "No APK found"
        fi
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
      if: always()
    
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/*.apk
        name: 优品快回复 ${{ github.ref_name }}
        body: |
          ## 🎉 优品快回复 ${{ github.ref_name }} 正式发布

          ### ✨ 功能特性
          - 💬 悬浮窗快捷回复
          - 🏷️ 三级话术分类（公司/小组/私人）
          - 🔍 智能搜索
          - 📋 一键复制
          - 📊 使用统计
          - 🎨 微信风格 UI

          ### 📱 系统要求
          - Android 5.0+ (API 21+)

          ### 🚀 安装方式
          1. 下载 APK 文件
          2. 允许安装未知来源应用
          3. 安装并开启悬浮窗权限
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
